name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Bootstrap verifier SHA-256 pins depend on reproducible output.
          # Keep this exact until a deliberate verifier trust-root transition.
          go-version: '1.23.2'
          cache: true
      - name: Test and validate
        run: |
          go test ./...
          go vet ./...
          go test -race ./server ./agent
          for SCRIPT in scripts/*.sh scripts/nlm; do
            sh -n "$SCRIPT"
          done
          node --check server/web/app.js
      - name: Build static Linux binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid release tag: $VERSION" >&2; exit 1; }
          V="${VERSION#v}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags="-s -w -X main.serverVersion=$V -X main.releaseRepo=${GITHUB_REPOSITORY}" -o "dist/nodelume-server-linux-$ARCH" ./server
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags="-s -w -X main.agentVersion=$V -X main.releaseRepo=${GITHUB_REPOSITORY}" -o "dist/nodelume-agent-linux-$ARCH" ./agent
            curl -fL --retry 3 -o "dist/nodelume-verify-linux-$ARCH" "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.1/nodelume-verify-linux-$ARCH"
            chmod 0755 "dist/nodelume-verify-linux-$ARCH"
          done
          # Build-time pinning of the verifier SHA-256 into Release installers.
            GOT_AMD64=$(sha256sum dist/nodelume-verify-linux-amd64 | awk '{print $1}')
            GOT_ARM64=$(sha256sum dist/nodelume-verify-linux-arm64 | awk '{print $1}')
            [ "$GOT_AMD64" = "b408dff9c54e194c9a437388beebe1bc010abf969499caba629f026d8dde3a27" ] || { echo "unexpected amd64 bootstrap verifier SHA256" >&2; exit 1; }
            [ "$GOT_ARM64" = "9fd8c596ea5f6a86b8f8a137786b641815e7159191364af9f685f6f3b914649e" ] || { echo "unexpected arm64 bootstrap verifier SHA256" >&2; exit 1; }
            
            cp release.pub dist/release.pub
            cp scripts/install-server.sh scripts/install-agent.sh scripts/nlm dist/
          
          for INSTALLER in dist/install-server.sh dist/install-agent.sh; do
            sed -i "s/VERIFIER_SHA_AMD64='[^']*'/VERIFIER_SHA_AMD64='$GOT_AMD64'/g" "$INSTALLER"
            sed -i "s/VERIFIER_SHA_ARM64='[^']*'/VERIFIER_SHA_ARM64='$GOT_ARM64'/g" "$INSTALLER"
          
            grep -Fq "VERIFIER_SHA_AMD64='$GOT_AMD64'" "$INSTALLER" || {
            echo "failed to pin amd64 verifier hash into $INSTALLER" >&2
            exit 1
          }
          
            grep -Fq "VERIFIER_SHA_ARM64='$GOT_ARM64'" "$INSTALLER" || {
            echo "failed to pin arm64 verifier hash into $INSTALLER" >&2
            exit 1
          }
          done
          for SCRIPT in dist/install-server.sh dist/install-agent.sh dist/nlm; do
            sh -n "$SCRIPT"
          done
          cat > dist/release-manifest.json <<JSON
          {"version":"$V","protocol":1,"min_agent":"1.0.0","min_server":"1.0.0"}
          JSON
      - name: Checksums and Ed25519 signature
        env:
          NODELUME_SIGNING_PRIVATE_KEY: ${{ secrets.NODELUME_SIGNING_PRIVATE_KEY }}
        run: |
          set -eu
          cd dist
          sha256sum nodelume-server-linux-* nodelume-agent-linux-* nodelume-verify-linux-* release.pub release-manifest.json install-server.sh install-agent.sh nlm > checksums.txt
          cd ..
          NODELUME_RELEASE_PUBLIC_KEY="$(cat release.pub)" go run ./tools/sign dist/checksums.txt dist/checksums.sig
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --title "NodeLume ${{ github.ref_name }}" --generate-notes
